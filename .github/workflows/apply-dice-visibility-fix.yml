name: Apply dice visibility fix

on:
  push:
    branches:
      - fix/dice-full-visibility

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/dice-full-visibility
          fetch-depth: 0

      - name: Keep disabled dice fully visible
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controls = Path('android/app/src/main/java/com/ludoproof/game/feature/offline/presentation/gameplay/OfflineGameplayControlsUi.kt')
          text = controls.read_text(encoding='utf-8')
          old = '''    diceHost?.isEnabled =\n        canRoll\n    diceHost?.alpha =\n        if (canRoll) {\n            1f\n        } else {\n            .58f\n        }\n'''
          new = '''    diceHost?.isEnabled =\n        canRoll\n    // Disabled means non-interactive only. Never fade the dice itself: after a\n    // resolved roll the player still needs to read that face while choosing a token.\n    diceHost?.alpha =\n        1f\n'''
          if text.count(old) != 1:
              raise SystemExit('OfflineGameplayControlsUi.kt: expected dice alpha block once')
          controls.write_text(text.replace(old, new, 1), encoding='utf-8')

          rail = Path('android/app/src/main/java/com/ludoproof/game/feature/offline/presentation/gameplay/OfflinePlayerRailUi.kt')
          text = rail.read_text(encoding='utf-8')
          old = '''    control.alpha =\n        if (cpuTurn) {\n            .82f\n        } else {\n            1f\n        }\n'''
          new = '''    // Keep opponent/CPU dice at full visual contrast as well. Interaction is\n    // controlled by isEnabled; opacity must not make the neutral face unreadable.\n    control.alpha =\n        1f\n'''
          if text.count(old) != 1:
              raise SystemExit('OfflinePlayerRailUi.kt: expected CPU alpha block once')
          rail.write_text(text.replace(old, new, 1), encoding='utf-8')

          dice = Path('android/app/src/main/java/com/ludoproof/game/game/ui/components/DiceView.kt')
          text = dice.read_text(encoding='utf-8')
          replacements = {
              '0xFF8B8B8B.toInt()': '0xFF767676.toInt()',
              '0xFF3F3F3F.toInt()': '0xFF292929.toInt()',
              '0xFFB8B8B8.toInt()': '0xFFD0D0D0.toInt()',
              '0xFFF4F4F4.toInt()': '0xFFFAFAFA.toInt()',
              '0xFFDCDCDC.toInt()': '0xFFE8E8E8.toInt()',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'DiceView.kt: missing expected color {old}')
              text = text.replace(old, new)
          dice.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Android unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/apply-dice-visibility-fix.yml
          git diff --check
          git config user.name "rekixo-fix-bot"
          git config user.email "ai@rekixo.com"
          git add -A
          git commit -m "fix: keep gameplay dice fully visible"
          git push origin HEAD:fix/dice-full-visibility
