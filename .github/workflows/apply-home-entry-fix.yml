      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Server tests
        working-directory: server
        run: npm test

      - name: Ludo Paws geometry gates
        run: |
          node scripts/check-ludo-paws-pawn-rendering.mjs
          node scripts/check-ludo-paws-animation-fx.mjs
          node scripts/check-ludo-paws-offline-integration.mjs
          node scripts/check-ludo-paws-online-integration.mjs

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Android unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Commit verified fix and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/apply-home-entry-fix.yml
          git diff --check
          git config user.name "rekixo-fix-bot"
          git config user.email "ai@rekixo.com"
          git add -A
          git commit -m "fix: skip extra track cell before home lane"
          git push origin HEAD:fix/home-entry-off-by-one
