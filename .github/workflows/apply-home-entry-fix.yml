name: Apply home-entry off-by-one fix

on:
  push:
    branches: [fix/home-entry-off-by-one]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/home-entry-off-by-one
          fetch-depth: 0

      - name: Apply shared home-entry fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 exact match, found {count}")
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 regex match, found {count}: {pattern[:80]}")
              write(path, updated)

