name: Apply home extra-turn fix

on:
  push:
    branches: [fix/extra-turn-on-home]
    paths:
      - scripts/apply-home-extra-turn.mjs
      - .github/workflows/apply-home-extra-turn.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/extra-turn-on-home
          persist-credentials: true

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Apply targeted rule change
        run: node scripts/apply-home-extra-turn.mjs

      - name: Server tests
        working-directory: server
        run: npm test

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"

      - name: Android unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Commit verified change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            server/src/game.js \
            server/test/home-extra-turn.test.js \
            android/app/src/main/java/com/ludoproof/game/feature/offline/domain/engine/OfflineGameEngine.kt \
            android/app/src/main/java/com/ludoproof/game/game/domain/model/LudoExtraTurnPolicy.kt \
            android/app/src/test/java/com/ludoproof/game/LudoExtraTurnPolicyTest.kt
          git diff --cached --check
          git commit -m "feat: grant extra turn when a token reaches home"
          git push origin HEAD:fix/extra-turn-on-home
