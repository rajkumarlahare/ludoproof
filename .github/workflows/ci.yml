name: LudoProof CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ludoproof-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Repository security gate
        working-directory: .
        run: node scripts/security-check.mjs
      - name: Server tests
        run: npm test
      - name: Cloudflare Worker dry run
        run: npx --yes wrangler@4.135.0 deploy --dry-run --outdir .wrangler-dry-run
      - name: Generate CycloneDX SBOM
        working-directory: .
        run: node scripts/generate-sbom.mjs
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ludoproof-sbom
          path: |
            ludoproof-sbom.cdx.json
            ludoproof-sbom.sha256
          if-no-files-found: error
          retention-days: 90

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.9"
      - name: Release lint
        run: gradle -p android :app:lintRelease --stacktrace
      - name: Assemble debug APK
        run: gradle -p android :app:assembleDebug --stacktrace
      - name: Assemble release APK
        run: gradle -p android :app:assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ludoproof-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
