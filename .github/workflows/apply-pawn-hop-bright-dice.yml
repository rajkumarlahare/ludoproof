name: Apply pawn hop and bright dice

on:
  push:
    branches:
      - fix/pawn-hop-bright-dice

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pawn-hop-bright-dice
          fetch-depth: 0

      - name: Apply requested gameplay polish
        run: |
          python3 scripts/apply-pawn-hop-bright-dice.py
          python3 scripts/repair-pawn-hop-patcher.py
          git diff --check

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Pawn rendering gate
        run: node scripts/check-ludo-paws-pawn-rendering.mjs

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Android unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Commit verified changes
        run: |
          rm .github/workflows/apply-pawn-hop-bright-dice.yml
          rm scripts/apply-pawn-hop-bright-dice.py
          rm scripts/repair-pawn-hop-patcher.py
          git diff --check
          git config user.name "rekixo-ui-bot"
          git config user.email "ai@rekixo.com"
          git add -A
          git commit -m "ui: hop pawns cell by cell and brighten dice"
          git push origin HEAD:fix/pawn-hop-bright-dice
