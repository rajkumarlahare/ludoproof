name: Apply gameplay HUD polish

on:
  push:
    branches:
      - ui/gameplay-hud-polish

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout polish branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ui/gameplay-hud-polish
          fetch-depth: 0

      - name: Apply gameplay HUD polish
        run: |
          python3 scripts/apply-gameplay-hud-polish.py
          git diff --check

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Ludo Paws UI gates
        run: |
          node scripts/check-ludo-paws-pawn-rendering.mjs
          node scripts/check-ludo-paws-animation-fx.mjs
          node scripts/check-ludo-paws-offline-integration.mjs

      - name: Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.11.1"

      - name: Install Android 16 SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Android unit tests
        run: gradle -p android :app:testDebugUnitTest --stacktrace

      - name: Commit verified polish
        run: |
          rm .github/workflows/apply-gameplay-hud-polish.yml
          rm scripts/apply-gameplay-hud-polish.py
          git diff --check
          git config user.name "rekixo-ui-bot"
          git config user.email "ai@rekixo.com"
          git add -A
          git commit -m "ui: polish gameplay HUD alignment and dice"
          git push origin HEAD:ui/gameplay-hud-polish
